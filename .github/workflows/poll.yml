name: Telegram approvals (every 5 min)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m newsbot.poll
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          BRAND_NAME: ${{ secrets.BRAND_NAME }}
          BRAND_HANDLE: ${{ secrets.BRAND_HANDLE }}
          USE_GOOGLE_NEWS: ${{ secrets.USE_GOOGLE_NEWS }}
          ATTACH_LINKS: ${{ secrets.ATTACH_LINKS }}
          MAX_POSTS_PER_DAY: ${{ secrets.MAX_POSTS_PER_DAY }}
          MAX_POLITICS_PER_DAY: ${{ secrets.MAX_POLITICS_PER_DAY }}
          SPOTLIGHT_AUTO: ${{ secrets.SPOTLIGHT_AUTO }}
          REPORT_LEVEL: ${{ secrets.REPORT_LEVEL }}
          ARTICLE_MAX_AGE_HOURS: ${{ secrets.ARTICLE_MAX_AGE_HOURS }}
          MAX_PENDING_REVIEW: ${{ secrets.MAX_PENDING_REVIEW }}
      - name: Tell me on Telegram if this run crashed
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # poll runs every 5 min: alert at most about once an hour
          [ "$(date -u +%M)" -lt 10 ] || exit 0
          [ -n "$TG_TOKEN" ] && curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "text=❌ GitHub run failed: ${{ github.workflow }}
          $RUN_URL
          Open the link, or run the 'Diagnose' workflow for a full check." > /dev/null || true
