name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository activity.
# This makes a tiny commit twice a month so the schedules keep running.
on:
  schedule:
    - cron: "30 4 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .heartbeat
          git commit -m "chore: keepalive heartbeat" || echo "nothing to commit"
          git push
